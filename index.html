    <!-- Auto Refresh Script (Optional) -->
    <script>
        // Auto refresh setiap 5 menit untuk cek apakah maintenance sudah selesai
        setTimeout(function() {
            location.reload();
        }, 300000); // 5 menit = 300000 ms
        
        // Countdown timer (optional)
        let countdownElement = document.createElement('div');
        countdownElement.className = 'text-center mt-4 text-white/60 text-sm';
        countdownElement.innerHTML = '<i class="fas fa-sync-alt mr-2"></i>Halaman akan refresh otomatis dalam <span id="countdown">5:00</span> menit';
        document.querySelector('.max-w-4xl').appendChild(countdownElement);
        
        let seconds = 300;
        setInterval(function() {
            seconds--;
            let minutes = Math.floor(seconds / 60);
            let remainingSeconds = seconds % 60;
            document.getElementById('countdown').textContent = 
                minutes + ':' + (remainingSeconds < 10 ? '0' : '') + remainingSeconds;
            
            if (seconds <= 0) {
                location.reload();
            }
        }, 1000);
    </script>
