services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datainvest
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - app_writable:/var/www/html/writable
      - app_uploads:/var/www/html/public/uploads
    ports:
      - "9006:80"
    env_file:
      - .env
    networks:
      - mysql-net
volumes:
  app_writable:
  app_uploads:
networks:
  mysql-net:
    external: true
